<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画検索アプリ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- 1. 画面一番上の検索バー -->
  <header class="header">
    <div class="search-container">
      <input type="text" class="search-input" placeholder="動画を検索...">
      <button class="search-button">検索</button>
    </div>
  </header>

  <!-- 2. 動画風カードが並ぶエリア -->
  <main class="container">
    <div class="video-grid">

      <!-- 動画カード 1 -->
      <div class="video-card">
        <div class="thumbnail">
          <img src="./images/play-button.png" alt="再生" class="play-image">
        </div>
        <div class="video-info">
          <h3 class="video-title">PCの基本的な使い方 1</h3>
          <p class="video-author">チャンネル名 A</p>
        </div>
      </div>

      <!-- 動画カード 2 -->
      <div class="video-card">
        <div class="thumbnail">
          <img src="./images/play-button.png" alt="再生" class="play-image">
        </div>
        <div class="video-info">
          <h3 class="video-title">Zoomの使い方 </h3>
          <p class="video-author">チャンネル名 B</p>
        </div>
      </div>

      <!-- 動画カード 3 -->
      <div class="video-card">
        <div class="thumbnail">
          <img src="./images/play-button.png" alt="再生" class="play-image">
        </div>
        <div class="video-info">
          <h3 class="video-title">ショートカットキー講座</h3>
          <p class="video-author">チャンネル名 C</p>
        </div>
      </div>

      <!-- 動画カード 4 -->
      <div class="video-card">
        <div class="thumbnail">
          <<img src="./images/play-button.png" alt="再生" class="play-image">
        </div>
        <div class="video-info">
          <h3 class="video-title">ファイルの操作</h3>
          <p class="video-author">チャンネル名 D</p>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
